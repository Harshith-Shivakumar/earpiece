# Adds all NVIDIA GPUs to the bridge container (needs the NVIDIA Container Toolkit).
# Used together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  bridge:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
